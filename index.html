<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Ball Fortune</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wand-cursor" id="wandCursor" aria-hidden="true"></div>
    <div class="star-frame" aria-hidden="true"></div>
    <div class="background-stars" id="backgroundStars" aria-hidden="true"></div>
    <div id="starRain" aria-hidden="true"></div>

    <main class="scene" aria-live="polite">
      <h1 class="fortune-title">Ask a Question and You Shall Receive the Answer</h1>

      <div class="magic-ball-wrap">
        <button class="magic-ball" id="magicBall" type="button" aria-label="Ask the magic ball">
          <span class="ball-glow"></span>
        </button>
      </div>

      <label class="prompt-box" for="questionInput">
        <textarea id="questionInput" rows="1" spellcheck="false">Ask and you shall receive</textarea>
      </label>
    </main>

    <script src="script.js"></script>
  </body>
</html>
